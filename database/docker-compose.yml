# Local MySQL for development:  docker compose up -d
services:
  mysql:
    image: mysql:8.0
    container_name: boc-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "Strong#Passw0rd"
      MYSQL_DATABASE: "BusyOnCloud"
      MYSQL_USER: "boc_app"
      MYSQL_PASSWORD: "ChangeMe#StrongPassword1"
    ports:
      - "3306:3306"
    volumes:
      - boc-mysqldata:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
volumes:
  boc-mysqldata:
