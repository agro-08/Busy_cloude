# Local SQL Server for development:  docker compose up -d
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: boc-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Strong#Passw0rd"
    ports:
      - "1433:1433"
    volumes:
      - boc-sqldata:/var/opt/mssql
volumes:
  boc-sqldata:
